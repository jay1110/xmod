// JXAC Force CVAR Configuration
// Format:
//   forcecvar <cvar> <value>           - Force exact value
//   sv_cvar <cvar> IN <min> <max>      - Allow range
//   sv_cvar <cvar> EQ <value>          - Must equal value

configname "JXAC Cvar Restrictions"

// Range restrictions
sv_cvar com_maxfps IN 30 500
sv_cvar r_flares IN 0 1
sv_cvar cl_maxpackets IN 30 125
sv_cvar cl_bobup IN 0 0.01
sv_cvar cg_fov IN 90 120
sv_cvar rate IN 25000 90000
sv_cvar r_subdivisions IN 1 20
sv_cvar r_lodcurveerror IN 60 500

// Forced values (cannot be changed)
forcecvar r_primitives 2
forcecvar snaps 20
forcecvar r_ambientScale 0.5
forcecvar r_colorMipLevels 0
forcecvar r_drawentities 1
forcecvar r_drawworld 1
forcecvar r_lightmap 0
forcecvar r_showmodelbounds 0
forcecvar r_shownormals 0
forcecvar r_wolffog 1
forcecvar r_zfar 0
forcecvar r_showtris 0
forcecvar r_znear 3
forcecvar cl_freelook 1
forcecvar cl_timenudge 0
forcecvar cg_pmColor 0
forcecvar cl_pitchspeed 140
forcecvar cl_yawspeed 140
