name: Build Documentation

on:
  workflow_dispatch:
    inputs:
      legacy_docbook:
        description: Also build the legacy DocBook HTML and PDF outputs
        type: boolean
        default: false
  pull_request:
    paths:
      - 'docs/**'
      - 'doc/**'
      - '.readthedocs.yaml'
      - '.github/workflows/build-docs.yml'
      - 'build-tools/generate_server_configs.py'
      - 'pkg/*.cfg.m4'
      - 'project/info.db'
      - 'CHANGELOG.md'
      - 'src/game/g_main.cpp'
      - 'src/game/static.cpp'
      - 'src/game/g_xmod.h'
      - 'src/bgame/bg_public.h'
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'doc/**'
      - '.readthedocs.yaml'
      - '.github/workflows/build-docs.yml'
      - 'build-tools/generate_server_configs.py'
      - 'pkg/*.cfg.m4'
      - 'project/info.db'
      - 'CHANGELOG.md'
      - 'src/game/g_main.cpp'
      - 'src/game/static.cpp'
      - 'src/game/g_xmod.h'
      - 'src/bgame/bg_public.h'

permissions:
  contents: read

jobs:
  sphinx:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Check public configuration templates
        run: python build-tools/generate_server_configs.py --check
      - name: Build searchable documentation with warnings treated as errors
        run: python -m sphinx -n -W --keep-going -b html docs docs/_build/html
      - name: Upload complete HTML site
        uses: actions/upload-artifact@v7
        with:
          name: xmod-sphinx-html
          path: docs/_build/html/
          if-no-files-found: error
          retention-days: 30

  legacy-docbook:
    if: github.event_name == 'workflow_dispatch' && inputs.legacy_docbook
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      
    - name: Install DocBook dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          docbook-xsl \
          xsltproc \
          fop \
          libxml2-utils \
          python3 \
          m4
    
    - name: Make documentation scripts executable
      run: chmod +x doc/lib/*.py
    
    - name: Build documentation
      run: make doc
      
    - name: Upload HTML documentation
      uses: actions/upload-artifact@v7
      with:
        name: documentation-html
        path: |
          build/doc/en/html/
          build/doc/en/styles/
          build/doc/en/images/
          build/doc/en/figures/
        retention-days: 30
        
    - name: Upload PDF documentation
      uses: actions/upload-artifact@v7
      with:
        name: documentation-pdf
        path: build/doc/en/*.pdf
        retention-days: 30
        
    - name: Upload single-page HTML
      uses: actions/upload-artifact@v7
      with:
        name: documentation-html-single
        path: |
          build/doc/en/book.html
          build/doc/en/styles/
          build/doc/en/images/
          build/doc/en/figures/
        retention-days: 30
