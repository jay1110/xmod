name: Build Documentation

on:
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      
    - name: Install DocBook dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          docbook-xsl \
          xsltproc \
          fop \
          libxml2-utils \
          python3 \
          m4
    
    - name: Make documentation scripts executable
      run: chmod +x doc/lib/*.py
    
    - name: Build documentation
      run: make doc
      
    - name: Upload HTML documentation
      uses: actions/upload-artifact@v7
      with:
        name: documentation-html
        path: |
          build/doc/en/html/
          build/doc/en/styles/
          build/doc/en/images/
          build/doc/en/figures/
        retention-days: 30
        
    - name: Upload PDF documentation
      uses: actions/upload-artifact@v7
      with:
        name: documentation-pdf
        path: build/doc/en/*.pdf
        retention-days: 30
        
    - name: Upload single-page HTML
      uses: actions/upload-artifact@v7
      with:
        name: documentation-html-single
        path: |
          build/doc/en/book.html
          build/doc/en/styles/
          build/doc/en/images/
          build/doc/en/figures/
        retention-days: 30
