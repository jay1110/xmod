name: Quick Build (Linux 64-bit only)

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'copilot/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux64-quick:
    name: Quick Test Build - Linux 64-bit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 zip m4
      
      - name: Ensure scripts are executable
        run: chmod +x project/info.py
      
      - name: Build qagame only (Linux 64-bit Release)
        run: |
          # Build only the qagame module (server-side) for faster quick builds
          # Skip cgame and ui which are client-side only
          # MODULES excludes src/cgame, src/ui, pak/pak, pkg/pkg, doc/book
          make PLATFORM=linux64 VARIANT=release all MODULES="src/lua src/sqlite3 src/base src/game"
      
      - name: Upload Linux 64-bit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xmod-linux64-quick
          path: |
            build.linux64-release/game/qagame.mp.x86_64.so
          retention-days: 7
      
      - name: Build summary
        run: |
          echo "## Build Summary :white_check_mark:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Quick test build completed successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Built files:" >> $GITHUB_STEP_SUMMARY
          echo "- \`qagame.mp.x86_64.so\` - Server-side game module" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** Linux 64-bit only" >> $GITHUB_STEP_SUMMARY
          echo "**Configuration:** Release" >> $GITHUB_STEP_SUMMARY
          echo "**Artifacts:** Available for 7 days" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "For full multi-platform builds, use the 'Build Multi-Platform' workflow." >> $GITHUB_STEP_SUMMARY
