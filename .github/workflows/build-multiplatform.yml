name: Build Multi-Platform

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'copilot/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read


jobs:
  build-linux64:
    name: Build Linux 64-bit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 zip m4
      
      - name: Ensure scripts are executable
        run: chmod +x project/info.py
      
      - name: Build Linux 64-bit
        run: PLATFORM=linux64 make release
      
      - name: Upload Linux 64-bit artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xmod-linux64
          path: |
            build.linux64-release/game/qagame.mp.x86_64.so
            build.linux64-release/cgame/cgame.mp.x86_64.so
            build.linux64-release/ui/ui.mp.x86_64.so

  build-linux32:
    name: Build Linux 32-bit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 gcc-multilib g++-multilib zip m4
      
      - name: Ensure scripts are executable
        run: chmod +x project/info.py
      
      - name: Build Linux 32-bit
        run: PLATFORM=linux make release
      
      - name: Upload Linux 32-bit artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xmod-linux32
          path: |
            build.linux-release/game/qagame.mp.i386.so
            build.linux-release/cgame/cgame.mp.i386.so
            build.linux-release/ui/ui.mp.i386.so

  build-windows:
    name: Build Windows 32-bit and 64-bit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 mingw-w64 zip m4
      
      - name: Ensure scripts are executable
        run: chmod +x project/info.py
      
      - name: Build Windows 32-bit
        run: PLATFORM=mingw make release
      
      - name: Build Windows 64-bit
        run: PLATFORM=mingw64 make release
      
      - name: Upload Windows 32-bit artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xmod-windows32
          path: |
            build.mingw-release/game/qagame_mp_x86.dll
            build.mingw-release/cgame/cgame_mp_x86.dll
            build.mingw-release/ui/ui_mp_x86.dll
      
      - name: Upload Windows 64-bit artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xmod-windows64
          path: |
            build.mingw64-release/game/qagame_mp_x64.dll
            build.mingw64-release/cgame/cgame_mp_x64.dll
            build.mingw64-release/ui/ui_mp_x64.dll

  build-linux-arm64:
    name: Build Linux ARM64 (aarch64)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [cgame, ui, game]
    steps:
      - uses: actions/checkout@v6
      
      - name: Install ARM64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu python3 zip m4
      
      - name: Ensure scripts are executable
        run: chmod +x project/info.py
      
      - name: Build ${{ matrix.module }} for ARM64
        run: |
          # Use the existing linux-aarch64 platform configuration with cross-compilation
          PLATFORM=linux-aarch64 CROSS_COMPILE=1 make release
      
      - name: Organize artifacts
        run: |
          mkdir -p artifacts/linux-arm64
          # Find and copy the built .so files
          find build.linux-aarch64-release/${{ matrix.module }} -name "*.so" -exec cp {} artifacts/linux-arm64/ \;
          ls -la artifacts/linux-arm64/
      
      - name: Upload Linux ARM64 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xmod-linux-arm64-${{ matrix.module }}
          path: artifacts/linux-arm64/*.so
          if-no-files-found: error

  build-macos:
    name: Build macOS Universal Binaries
    runs-on: macos-latest
    strategy:
      matrix:
        module: [cgame, ui, game]
    steps:
      - uses: actions/checkout@v6
      
      - name: Install dependencies
        run: |
          brew install python3 zip
      
      - name: Ensure scripts are executable
        run: chmod +x project/info.py
      
      - name: Build ${{ matrix.module }} for x86_64
        run: |
          PLATFORM=osx64 make release
          mkdir -p artifacts/macos/x86_64
          # Copy the actual binary files (not the ZIP archives)
          find build.osx64-release/${{ matrix.module }} -name "*.binary" -exec cp {} artifacts/macos/x86_64/ \; || true
      
      - name: Build ${{ matrix.module }} for arm64
        run: |
          # Clean previous build
          rm -rf build.osx64-release
          # Build for arm64 using osx-arm64 platform
          PLATFORM=osx-arm64 make release
          mkdir -p artifacts/macos/arm64
          # Copy the actual binary files (not the ZIP archives)
          find build.osx-arm64-release/${{ matrix.module }} -name "*.binary" -exec cp {} artifacts/macos/arm64/ \; || true
      
      - name: Create universal binaries
        run: |
          mkdir -p artifacts/macos/universal
          
          # Process all built .binary files and create universal binaries
          for x86_file in artifacts/macos/x86_64/*.binary; do
            if [ -f "$x86_file" ]; then
              filename=$(basename "$x86_file")
              # Remove .binary extension to get the base name (e.g., ui_mac)
              basename_no_ext="${filename%.binary}"
              arm64_file="artifacts/macos/arm64/$filename"
              universal_binary="artifacts/macos/universal/$filename"
              
              if [ -f "$arm64_file" ]; then
                echo "Creating universal binary for $filename"
                lipo -create "$x86_file" "$arm64_file" -output "$universal_binary"
              else
                echo "Warning: ARM64 version not found for $filename, using x86_64 only"
                cp "$x86_file" "$universal_binary"
              fi
              
              # Create the macOS bundle structure and ZIP it
              bundle_dir="artifacts/macos/universal/${basename_no_ext}.bundle"
              mkdir -p "${bundle_dir}/Contents/MacOS"
              
              # Create Info.plist
              cat > "${bundle_dir}/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>English</string>
            <key>CFBundleExecutable</key>
            <string>${basename_no_ext}</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>${basename_no_ext}</string>
            <key>CFBundlePackageType</key>
            <string>BNDL</string>
          </dict>
          </plist>
          EOF
              
              # Copy the universal binary into the bundle
              cp "$universal_binary" "${bundle_dir}/Contents/MacOS/${basename_no_ext}"
              
              # Create the ZIP archive (without .binary extension), using same format as build system
              (cd artifacts/macos/universal && zip -rq - "${basename_no_ext}.bundle") > "artifacts/macos/universal/${basename_no_ext}"
              
              # Clean up - remove bundle dir and .binary file, keep only the ZIP
              rm -rf "${bundle_dir}"
              rm -f "$universal_binary"
            fi
          done
          
          ls -la artifacts/macos/universal/
      
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xmod-macos-${{ matrix.module }}
          path: artifacts/macos/universal/*
          if-no-files-found: warn

  build-android:
    name: Build Android ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: 
          - name: arm64-v8a
            platform: android-arm64
          - name: armeabi-v7a
            platform: android-armv7a
          - name: x86
            platform: android-x86
          - name: x86_64
            platform: android-x86_64
        module: [cgame, ui, game]
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c
          add-to-path: true
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 zip m4
      
      - name: Ensure scripts are executable
        run: chmod +x project/info.py
      
      - name: Build ${{ matrix.module }} for Android ${{ matrix.abi.name }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          echo "NDK Path: $ANDROID_NDK_HOME"
          PLATFORM=${{ matrix.abi.platform }} make release
      
      - name: Organize artifacts
        run: |
          mkdir -p artifacts/android/${{ matrix.abi.name }}
          # Find and copy the built .so files
          find build.${{ matrix.abi.platform }}-release/${{ matrix.module }} -name "*.so" -exec cp {} artifacts/android/${{ matrix.abi.name }}/ \;
          ls -la artifacts/android/${{ matrix.abi.name }}/
      
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xmod-android-${{ matrix.abi.name }}-${{ matrix.module }}
          path: artifacts/android/${{ matrix.abi.name }}/*.so
          if-no-files-found: error

  create-release-package:
    name: Create Release Package
    needs: [build-linux64, build-linux32, build-windows, build-linux-arm64, build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      
      - name: Create unified release package
        run: |
          mkdir -p release/xmod-multiplatform
          
          # Debug: Show artifact structure
          echo "=== Downloaded artifact structure ==="
          find artifacts -type f
          
          # Helper function to copy files and report status
          copy_platform_files() {
            local src_pattern="$1"
            local dest_dir="$2"
            local platform_name="$3"
            
            mkdir -p "$dest_dir"
            local count=$(find artifacts -path "$src_pattern" -type f 2>/dev/null | wc -l)
            if [ "$count" -gt 0 ]; then
              find artifacts -path "$src_pattern" -type f -exec cp {} "$dest_dir/" \;
              echo "✓ $platform_name: copied $count file(s)"
            else
              echo "⚠ $platform_name: no files found matching $src_pattern"
            fi
          }
          
          echo ""
          echo "=== Copying platform files ==="
          
          # === Windows 32-bit ===
          copy_platform_files "*/xmod-windows32/*.dll" "release/xmod-multiplatform/windows-x86" "Windows 32-bit"
          
          # === Windows 64-bit ===
          copy_platform_files "*/xmod-windows64/*.dll" "release/xmod-multiplatform/windows-x64" "Windows 64-bit"
          
          # === Linux 32-bit ===
          copy_platform_files "*/xmod-linux32/*.so" "release/xmod-multiplatform/linux-x86" "Linux 32-bit"
          
          # === Linux 64-bit ===
          copy_platform_files "*/xmod-linux64/*.so" "release/xmod-multiplatform/linux-x64" "Linux 64-bit"
          
          # === Linux ARM64 ===
          copy_platform_files "*/xmod-linux-arm64-*/*.so" "release/xmod-multiplatform/linux-arm64" "Linux ARM64"
          
          # === macOS Universal ===
          copy_platform_files "*/xmod-macos-*/*" "release/xmod-multiplatform/macos" "macOS Universal"
          
          # === Android ===
          copy_platform_files "*/xmod-android-arm64-v8a-*/*.so" "release/xmod-multiplatform/android/arm64-v8a" "Android arm64-v8a"
          copy_platform_files "*/xmod-android-armeabi-v7a-*/*.so" "release/xmod-multiplatform/android/armeabi-v7a" "Android armeabi-v7a"
          copy_platform_files "*/xmod-android-x86-*/*.so" "release/xmod-multiplatform/android/x86" "Android x86"
          copy_platform_files "*/xmod-android-x86_64-*/*.so" "release/xmod-multiplatform/android/x86_64" "Android x86_64"
          
          # Show final structure
          echo ""
          echo "=== Release package structure ==="
          tree release/ || find release/ -type f
          
          # Create ZIP file
          cd release
          zip -r xmod-multiplatform-${{ github.sha }}.zip xmod-multiplatform/
          
          echo ""
          echo "=== ZIP created ==="
          ls -lh xmod-multiplatform-*.zip
      
      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: xmod-multiplatform-release
          path: release/xmod-multiplatform-*.zip
          if-no-files-found: error
