name: Build Multi-Platform

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'copilot/**'
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read


jobs:
  build-native-unix:
    uses: ./.github/workflows/build-native-unix.yml

  build-windows:
    name: Build Windows 32-bit and 64-bit (MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      # Omni-Bot exposes C++ callbacks. Its Windows DLL requires the MSVC ABI;
      # a successful MinGW link does not produce a compatible qagame module.
      - name: Configure Windows 32-bit
        run: cmake -S . -B build/msvc-x86 -G "Visual Studio 17 2022" -A Win32

      - name: Build Windows 32-bit
        run: cmake --build build/msvc-x86 --config Release --parallel

      - name: Check Windows x86 DLL loading and exports
        run: ctest --test-dir build/msvc-x86 -C Release --output-on-failure

      - name: Configure Windows 64-bit
        run: cmake -S . -B build/msvc-x64 -G "Visual Studio 17 2022" -A x64

      - name: Build Windows 64-bit
        run: cmake --build build/msvc-x64 --config Release --parallel

      - name: Check Windows x64 DLL loading and exports
        run: ctest --test-dir build/msvc-x64 -C Release --output-on-failure

      - name: Upload Windows 32-bit artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xmod-windows32
          if-no-files-found: error
          path: |
            build/msvc-x86/game/Release/qagame_mp_x86.dll
            build/msvc-x86/cgame/Release/cgame_mp_x86.dll
            build/msvc-x86/ui/Release/ui_mp_x86.dll

      - name: Upload Windows 64-bit artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xmod-windows64
          if-no-files-found: error
          path: |
            build/msvc-x64/game/Release/qagame_mp_x64.dll
            build/msvc-x64/cgame/Release/cgame_mp_x64.dll
            build/msvc-x64/ui/Release/ui_mp_x64.dll

  build-android:
    name: Build Android ${{ matrix.abi.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi:
          - name: arm64-v8a
            platform: android-arm64
          - name: armeabi-v7a
            platform: android-armv7a
          - name: x86
            platform: android-x86
          - name: x86_64
            platform: android-x86_64
        module: [cgame, ui, game]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c
          add-to-path: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 zip m4

      - name: Ensure scripts are executable
        run: chmod +x project/info.py

      - name: Build ${{ matrix.module }} for Android ${{ matrix.abi.name }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          echo "NDK Path: $ANDROID_NDK_HOME"
          PLATFORM=${{ matrix.abi.platform }} make release

      - name: Organize artifacts
        run: |
          mkdir -p artifacts/android/${{ matrix.abi.name }}
          # Find and copy the built .so files
          find build.${{ matrix.abi.platform }}-release/${{ matrix.module }} -name "*.so" -exec cp {} artifacts/android/${{ matrix.abi.name }}/ \;
          ls -la artifacts/android/${{ matrix.abi.name }}/

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xmod-android-${{ matrix.abi.name }}-${{ matrix.module }}
          path: artifacts/android/${{ matrix.abi.name }}/*.so
          if-no-files-found: error

  build-wasm:
    name: Build WebAssembly ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [cgame, ui, game]
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 zip m4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Ensure scripts are executable
        run: chmod +x project/info.py

      - name: Build ${{ matrix.module }} for WebAssembly
        run: |
          emcc --version
          PLATFORM=wasm make release

      - name: Organize artifacts
        run: |
          mkdir -p artifacts/wasm
          find build.wasm-release/${{ matrix.module }} -name "*.wasm32.so" -exec cp {} artifacts/wasm/ \;
          ls -la artifacts/wasm/

      - name: Upload WebAssembly artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xmod-wasm-${{ matrix.module }}
          path: artifacts/wasm/*.wasm32.so
          if-no-files-found: error

  create-release-package:
    name: Create Release Package
    needs: [build-native-unix, build-windows, build-android, build-wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create unified release package
        run: |
          mkdir -p release/xmod-multiplatform

          # Debug: Show artifact structure
          echo "=== Downloaded artifact structure ==="
          find artifacts -type f

          # Helper function to copy files and report status
          copy_platform_files() {
            local src_pattern="$1"
            local dest_dir="$2"
            local platform_name="$3"

            mkdir -p "$dest_dir"
            local count=$(find artifacts -path "$src_pattern" -type f 2>/dev/null | wc -l)
            if [ "$count" -gt 0 ]; then
              find artifacts -path "$src_pattern" -type f -exec cp {} "$dest_dir/" \;
              echo "✓ $platform_name: copied $count file(s)"
            else
              echo "⚠ $platform_name: no files found matching $src_pattern"
            fi
          }

          echo ""
          echo "=== Copying platform files ==="

          # === Windows 32-bit ===
          copy_platform_files "*/xmod-windows32/*.dll" "release/xmod-multiplatform/windows-x86" "Windows 32-bit"

          # === Windows 64-bit ===
          copy_platform_files "*/xmod-windows64/*.dll" "release/xmod-multiplatform/windows-x64" "Windows 64-bit"

          # === Linux 32-bit ===
          copy_platform_files "*/xmod-linux32/*.so" "release/xmod-multiplatform/linux-x86" "Linux 32-bit"

          # === Linux 64-bit ===
          copy_platform_files "*/xmod-linux64/*.so" "release/xmod-multiplatform/linux-x64" "Linux 64-bit"

          # === Linux ARM64 ===
          copy_platform_files "*/xmod-linux-arm64/*.so" "release/xmod-multiplatform/linux-arm64" "Linux ARM64"

          # musl modules are ABI-incompatible with glibc; keep them separate.
          copy_platform_files "*/xmod-linux-musl64/*.so" "release/xmod-multiplatform/linux-musl-x64" "Alpine/musl 64-bit"

          # === macOS Universal ===
          copy_platform_files "*/xmod-macos/*" "release/xmod-multiplatform/macos" "macOS Universal"

          # === Android ===
          copy_platform_files "*/xmod-android-arm64-v8a-*/*.so" "release/xmod-multiplatform/android/arm64-v8a" "Android arm64-v8a"
          copy_platform_files "*/xmod-android-armeabi-v7a-*/*.so" "release/xmod-multiplatform/android/armeabi-v7a" "Android armeabi-v7a"
          copy_platform_files "*/xmod-android-x86-*/*.so" "release/xmod-multiplatform/android/x86" "Android x86"
          copy_platform_files "*/xmod-android-x86_64-*/*.so" "release/xmod-multiplatform/android/x86_64" "Android x86_64"

          # Show final structure
          # Server defaults and Antirush rules are loose files alongside binaries.
          python3 build-tools/stage_server_files.py --release release/xmod-multiplatform/xmod

          echo ""
          echo "=== Release package structure ==="
          tree release/ || find release/ -type f

          # Create ZIP file
          cd release
          zip -r xmod-multiplatform-${{ github.sha }}.zip xmod-multiplatform/

          echo ""
          echo "=== ZIP created ==="
          ls -lh xmod-multiplatform-*.zip

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: xmod-multiplatform-release
          path: release/xmod-multiplatform-*.zip
          if-no-files-found: error
