// Native Xmod AntiRush (ported from AutoAdmin 4.4.5). Enable with: set g_antirush "2"

// Successful aa changes by authorized players. Empty string disables logging. Relative .log path inside the mod folder.
ANTIRUSH_LOG_FILE = "antirush/antirush.log"

// Preferred: grant C/aa for editing and C/antirush for mode/permission administration through Xmod's admin ACL.
// Example: !levedit LEVEL -acl +C/aa -acl +C/antirush
// Explicit admin ACL denials override the compatibility level/GUID grants below.
// Exact authenticated Xmod admin level with compatibility access to all Antirush commands.
ADMIN_LEVEL = 999

// Optional exact authenticated Xmod admin level for normal aa commands, as an alternative to authenticated Xmod GUID authorization. -1 disables it; 0 allows level-0 players. Does not grant aa addguid, aa removeguid or !antirush.
USER_LEVEL = -1

// Fraction of map timelimit protected: 1 / 3 = one third. Accepts a decimal or numeric fraction. 0 disables antirush.
PROTECT_PERCENT = 1 / 3

// Search radius used by aa antirush; saved points keep their own distances.
ANTIRUSH_SCAN_RANGE = 500

// Search radius used by aa trickplant; saved points keep their own distances.
TRICKPLANT_SCAN_RANGE = 200

// Only for reading older true/false map rows: true sets both class drain distances to the saved antirush distance times this value. Numeric class distances are independent.
COVERT_DRAIN_RANGE_MULTIPLIER = 2

// Countdown interval aligned to protection expiry. 60 announces whole minutes remaining, ending at 1 minute. 0 disables it.
ANTIRUSH_COUNTDOWN_INTERVAL_SECONDS = 60

// Seconds from match start before the initial announcement; waits for timing initialization.
START_MESSAGE_DELAY_SECONDS = 5

// Enable public announcements. Admin command replies and diagnostic logs are unaffected.
MESSAGES_ENABLED = true

// Initial protection announcement. Placeholders: {duration}, {objectives}. Display: chat, cpm, cp, print, or off.
MSG_START_CHANNEL = "chat"

MSG_START_TEXT = "^3AUTOADMIN:^7 Rushing the following objectives is prohibited for the first ^3{duration}^7: ^3{objectives}"

// Protection-ended announcement. Placeholder: {objectives}. Display: chat, cpm, cp, print, or off.
MSG_END_CHANNEL = "chat"

MSG_END_TEXT = "^3AUTOADMIN:^7 The following objectives are no longer protected: ^3{objectives}"

// Repeating countdown. Placeholders: {remaining}, {minutes}, {seconds}. Display: chat, cpm, cp, print, or off.
MSG_COUNTDOWN_CHANNEL = "cpm"

MSG_COUNTDOWN_TEXT = "^3Antirush expires in {remaining}^7"

// Human objective pickup or dynamite punishment. Placeholders: {player}, {objective}. Display: chat, cpm, cp, print, or off.
MSG_RUSH_CHANNEL = "chat"

MSG_RUSH_TEXT = "^3AUTOADMIN:^7 {player} ^7was killed for rushing protected objective ^3{objective}^7."

// Bot carrier restriction. Placeholders: {player}, {objective}. Display: chat, cpm, cp, print, or off.
MSG_BOT_CHANNEL = "chat"

MSG_BOT_TEXT = "^3AUTOADMIN:^7 Omni-bot {player} ^7is restricted from moving with protected objective ^3{objective}^7 until anti-rush protection expires."

// Removed trickplant with known owner. Placeholder: {player}. Display: chat, cpm, cp, print, or off.
MSG_TRICKPLANT_CHANNEL = "chat"

MSG_TRICKPLANT_TEXT = "^3AUTOADMIN:^7 Dynamite planted by {player} ^7was removed due to trickplant protection."

// Removed trickplant without a known owner. No placeholders. Display: chat, cpm, cp, print, or off.
MSG_TRICKPLANT_UNKNOWN_CHANNEL = "chat"

MSG_TRICKPLANT_UNKNOWN_TEXT = "^3AUTOADMIN:^7 An armed dynamite was removed due to trickplant protection."

// Announcement after aa antirush saves a point. Placeholder: {objective}. Display: chat, cpm, cp, print, or off.
MSG_OBJECTIVE_SAVED_CHANNEL = "chat"

MSG_OBJECTIVE_SAVED_TEXT = "^3AUTOADMIN:^7 Objective ^3{objective} ^7has been saved for antirush protection."
